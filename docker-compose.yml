version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: ai_data_science_platform
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    # No external port mapping needed - internal only
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 30s
      timeout: 10s
      retries: 5

  # Redis for Celery and Caching
  redis:
    image: redis:7-alpine
    # No external port mapping needed - internal only
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:password@postgres:5432/ai_data_science_platform
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
    volumes:
      - ./backend:/app
      - ./uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # Celery Worker
  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      - DATABASE_URL=postgresql://postgres:password@postgres:5432/ai_data_science_platform
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
    volumes:
      - ./backend:/app
      - ./uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A app.core.celery worker --loglevel=info

  # Celery Flower (Monitoring)
  celery-flower:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8003:5555"
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
    depends_on:
      - redis
    command: celery -A app.core.celery flower --port=5555

  # Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "8001:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://backend:8000
      - NEXT_PUBLIC_WS_URL=ws://backend:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

  # MLflow Tracking Server
  mlflow:
    image: python:3.10-slim
    ports:
      - "8002:5000"
    volumes:
      - mlflow_data:/mlflow
    working_dir: /mlflow
    command: >
      bash -c "pip install mlflow psycopg2-binary &&
               mlflow server --host 0.0.0.0 --port 5000 --default-artifact-root /mlflow/artifacts"

  # Data Cleaning uAgent (port 8004)
  data-cleaning-agent:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8004:8004"
    environment:
      - PYTHONPATH=/app
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - AGENTVERSE_API_TOKEN=${AGENTVERSE_API_TOKEN}
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=postgresql://postgres:password@postgres:5432/ai_data_science_platform
    depends_on:
      - backend
      - redis
    command: python app/api/uagents/data_cleaning_rest_agent.py
    restart: unless-stopped

  # Data Loader uAgent (port 8005)
  data-loader-agent:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8005:8005"
    environment:
      - PYTHONPATH=/app
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - AGENTVERSE_API_TOKEN=${AGENTVERSE_API_TOKEN}
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=postgresql://postgres:password@postgres:5432/ai_data_science_platform
    depends_on:
      - backend
      - redis
    command: python app/api/uagents/data_loader_rest_agent.py
    restart: unless-stopped

  # Data Visualization uAgent (port 8006)
  data-visualization-agent:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8006:8006"
    environment:
      - PYTHONPATH=/app
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - AGENTVERSE_API_TOKEN=${AGENTVERSE_API_TOKEN}
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=postgresql://postgres:password@postgres:5432/ai_data_science_platform
    depends_on:
      - backend
      - redis
    command: python app/api/uagents/data_visualization_rest_agent.py
    restart: unless-stopped

  # Feature Engineering uAgent (port 8007)
  feature-engineering-agent:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8007:8007"
    environment:
      - PYTHONPATH=/app
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - AGENTVERSE_API_TOKEN=${AGENTVERSE_API_TOKEN}
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=postgresql://postgres:password@postgres:5432/ai_data_science_platform
    depends_on:
      - backend
      - redis
    command: python app/api/uagents/feature_engineering_rest_agent.py
    restart: unless-stopped

  # H2O ML Training uAgent (port 8008)
  h2o-ml-agent:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8008:8008"
    environment:
      - PYTHONPATH=/app
      - JAVA_HOME=/usr/lib/jvm/default-java
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - AGENTVERSE_API_TOKEN=${AGENTVERSE_API_TOKEN}
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=postgresql://postgres:password@postgres:5432/ai_data_science_platform
    depends_on:
      - backend
      - redis
    command: python app/api/uagents/h2o_ml_rest_agent.py
    restart: unless-stopped

  # ML Prediction uAgent (port 8009)
  ml-prediction-agent:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8009:8009"
    environment:
      - PYTHONPATH=/app
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - AGENTVERSE_API_TOKEN=${AGENTVERSE_API_TOKEN}
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=postgresql://postgres:password@postgres:5432/ai_data_science_platform
    depends_on:
      - backend
      - redis
    command: python app/api/uagents/ml_prediction_rest_agent.py
    restart: unless-stopped

volumes:
  postgres_data:
  mlflow_data: 